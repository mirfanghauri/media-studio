name: Publish Versioned Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to publish (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      push_latest:
        description: "Also update the :latest tag"
        type: boolean
        default: true

jobs:
  build-and-push:
    name: Build & Publish ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api
            context: .
            dockerfile: api/Dockerfile
            image_name: irfanghori/media-studio-api
          - name: worker
            context: .
            dockerfile: worker/Dockerfile
            image_name: irfanghori/media-studio-worker
          - name: queue-monitor
            context: ./dashboard
            dockerfile: dashboard/Dockerfile
            image_name: irfanghori/media-studio-queue-monitor
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image_name: irfanghori/media-studio-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ matrix.service.image_name }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event.inputs.push_latest == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

